name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: soyuz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Typecheck, tests, and deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate Wrangler deployment bundle
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: soyuz-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify production D1 database identity
        env:
          CLOUDFLARE_D1_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_D1_READ_API_TOKEN"
          database_id="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")); const database = config.d1_databases?.find(({ binding }) => binding === "DB"); if (!database?.database_id) process.exit(1); process.stdout.write(database.database_id);')"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_D1_READ_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}")"
          printf '%s' "$response" | D1_DATABASE_ID="$database_id" node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            if (
              payload.success !== true ||
              payload.result?.uuid !== process.env.D1_DATABASE_ID ||
              payload.result?.name !== "soyuz-runs"
            ) {
              console.error("Cloudflare D1 identity check failed for soyuz-runs.");
              process.exit(1);
            }
          '

      - name: Verify production D1 migration compatibility
        env:
          CLOUDFLARE_D1_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_API_TOKEN }}
        run: node scripts/verify-production-migrations.mjs

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Check deployed health endpoint
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${DEPLOYMENT_URL%/}/health"
