name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    name: Analyze repository security posture
    if: github.repository == 'CyanAutomation/soyuz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          repo_token: ${{ github.token }}
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard

      - name: Retain Scorecard SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 5
